spring.application.name=restaurant

server.port=8080

# H2 / JPA (file-based, persists across restarts)
spring.datasource.url=jdbc:h2:file:./data/restaurantdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Actuator
management.endpoints.web.exposure.include=health,info,metrics

# App (JWT)
app.jwt.issuer=restaurant-api
# 32+ chars for HS256. For hackathon only; rotate for prod.
app.jwt.secret=dev-secret-change-me-dev-secret-change-me
app.jwt.accessTokenTtlSeconds=3600

# CORS (Vite dev server) - patterns allow any localhost dev port
app.cors.allowedOrigins=http://localhost:*,http://127.0.0.1:*
